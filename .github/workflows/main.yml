name: CI

on:
  push:
    branches: [master, next, alpha, beta]

permissions:
  contents: write # tags and GitHub releases
  issues: write
  pull-requests: write
  packages: read # install @periodica-press/* from GitHub Packages
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # trusted publishing requires npm >= 11.5.1 (bundled with Node 24)
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Staring Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Bootstraping packages
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install
      - name: Build package
        run: npm run prepare
      - name: Publish package
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
